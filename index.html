<!DOCTYPE html>
<html lang="es" class="h-full bg-[#11160e] text-[#f2f7ed]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#172012">
  <title>AgroTrack v1.0.02 | Contratistas Rurales, Pulverización y Maquinaria Agrícola</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-full flex flex-col font-sans antialiased bg-[#11160e] text-[#f2f7ed]">
  <!-- Toast Alerts Container -->
  <div id="toastContainer" role="status" aria-live="polite" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Header: Agricultural Precision Control Bar -->
  <header class="bg-[#172012] border-b border-[#29381e] sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-11 h-11 rounded-lg bg-[#243319] border border-[#3b5228] flex items-center justify-center text-[#bef264] shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6" aria-hidden="true">
            <path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/>
            <path d="M16 18h-5"/>
            <path d="M18 5a1 1 0 0 0-1 1v5.573"/>
            <path d="M3 4h9l1 7.246"/>
            <path d="M4 11V4"/>
            <path d="M7 15h.01"/>
            <path d="M8 10.1V4"/>
            <circle cx="18" cy="18" r="2"/>
            <circle cx="7" cy="15" r="5"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap">
            <h1 class="text-2xl font-extrabold tracking-tight text-[#f2f7ed]">AgroTrack</h1>
            <span id="appVersionBadge" class="text-xs font-mono text-[#9eb38c]">v1.0.02</span>
          </div>
          <p class="text-xs text-[#9eb38c] truncate">Contratistas Rurales, Pulverización y Maquinaria Agrícola</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-wrap">
        <!-- Wake Lock Button (Screen Wake Lock API) -->
        <button id="wakeLockBtn" type="button" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#202b18] hover:bg-[#29381e] text-[#c8dab8] flex items-center gap-2 border border-[#3b5228] whitespace-nowrap shrink-0" title="Mantener pantalla encendida en cabina">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <span class="hidden sm:inline">Modo Cabina:</span>
          <span>OFF</span>
        </button>

        <!-- New Labor Button -->
        <button type="button" data-action="open-new-order-modal" class="px-4 py-2 min-h-[44px] rounded-lg text-xs font-bold bg-[#84cc16] hover:bg-[#a3e635] text-[#0f1709] flex items-center gap-1.5 transition-colors whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>Iniciar Labor</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-[#23301a] overflow-x-auto py-2 bg-[#141b10]">
      <nav class="flex flex-nowrap sm:flex-wrap gap-1.5" role="tablist" aria-label="Navegación principal de AgroTrack">
        <button type="button" role="tab" aria-selected="true" data-tab="dashboard" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-bold bg-[#84cc16] text-[#0f1709] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          <span>Panel General</span>
        </button>
        <button type="button" role="tab" aria-selected="false" data-tab="labors" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#182113] hover:bg-[#222e1b] text-[#c8dab8] hover:text-[#f2f7ed] border border-[#2c3d20] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
          <span>Órdenes y ePOD</span>
        </button>
        <button type="button" role="tab" aria-selected="false" data-tab="weather-deltat" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#182113] hover:bg-[#222e1b] text-[#c8dab8] hover:text-[#f2f7ed] border border-[#2c3d20] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>
          <span>Clima y Delta T</span>
        </button>
        <button type="button" role="tab" aria-selected="false" data-tab="lots" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#182113] hover:bg-[#222e1b] text-[#c8dab8] hover:text-[#f2f7ed] border border-[#2c3d20] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
          <span>Campos y Lotes</span>
        </button>
        <button type="button" role="tab" aria-selected="false" data-tab="machinery" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#182113] hover:bg-[#222e1b] text-[#c8dab8] hover:text-[#f2f7ed] border border-[#2c3d20] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span>Flota y Gasoil</span>
        </button>
        <button type="button" role="tab" aria-selected="false" data-tab="settlement" class="px-3.5 py-2 min-h-[44px] rounded-lg text-xs font-semibold bg-[#182113] hover:bg-[#222e1b] text-[#c8dab8] hover:text-[#f2f7ed] border border-[#2c3d20] flex items-center gap-2 whitespace-nowrap shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 shrink-0" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
          <span>Liquidación Campaña</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="mainView" role="tabpanel">
      <!-- Dynamic View Rendered by JS -->
    </div>
  </main>

  <!-- Main Modal -->
  <div id="mainModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 no-print">
    <div class="bg-[#172012] border border-[#3b5228] rounded-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative">
      <div class="flex justify-between items-center gap-3 mb-4 border-b border-[#29381e] pb-3">
        <h2 id="modalTitle" class="text-[1.0625rem] font-bold text-[#f2f7ed]">Modal</h2>
        <button type="button" data-action="close-modal" aria-label="Cerrar modal" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-[#c8dab8] hover:text-[#f2f7ed] rounded-lg hover:bg-[#243319] border border-transparent hover:border-[#3b5228] shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-[#0e130b] border-t border-[#23301a] py-4 px-4 text-center text-xs text-[#9eb38c] no-print">
    AgroTrack v1.0.02 | Trazabilidad Agronómica | Sello Criptográfico SHA-256 | Control de Hectáreas Netas | AiAppFactory
  </footer>

  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/sw-register.js"></script>
</body>
</html>
